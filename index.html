<script src="https://cdn.jsdelivr.net/gh/netizenorg/netnet-standard-library/build/nn.min.js?v=10"></script>
<script src="https://unpkg.com/tone"></script>
<script>
/* global nn, Tone */
function setup() {
  Tone.Transport.bpm.value = nn.random([80,100,120,140,160])

  nn.get('body')
    .css({
      height: '100vh',
      userSelect: 'none',
      display: 'flex',
      flexWrap: 'wrap',
      justifyContent: 'center',
      alignItems: 'center',
      gap: '6.5rem',
    })

  const modes = ['major', 'minor']
  for (const key of nn.notes) {
    for (const mode of modes) {
      createSynthPlayer(key, mode)
    }
  }
}
  
function createSynthPlayer(key, mode) {
  const root = key + 4
  const scale = nn.createScale(root, mode)
  
  // get synth
  const synth = new Tone.Synth({
    volume: -12,
    oscillator: { type: nn.random(['square', 'triangle', 'sine', 'sawtooth']) }
  }).toDestination()

  let step = 0
  let speed = nn.random(['4', '8n', '16n', '32n'])
  const loop = new Tone.Loop((time) => 
  {synth.triggerAttackRelease(scale[step], speed, time)
   step = (step + 1) % 8}, speed).start()
  loop.mute = true

  // create button to start/stop
  const button = nn.create('button')
    .content(`${key} ${mode}`)
    .css({
      backgroundColor: 'lightgray',
    })
    .addTo('body')
    .on('click', 
    () => {
      Tone.Transport.start()
      loop.mute = !loop.mute
      button.css('backgroundColor', loop.mute ? 'lightgray' : 'green')
    })
}

nn.on('load', setup)
</script>
